name: Build and Release
on: push
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux
            target: x86_64-unknown-linux-gnu
          - platform: windows
            target: x86_64-pc-windows-gnu
    steps:
      - name: Check-out repository
        uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install mold, clang, Wayland, ALSA and x11 headers and dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang cmake pkg-config mold \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libwayland-egl-backend-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libasound2-dev libudev-dev
        shell: bash
      - name: Install MinGW cross-compiler (Windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt install -y gcc-mingw-w64-x86-64
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --verbose --target ${{ matrix.target }}
      - name: Verify executable (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: test target/${{ matrix.target }}/release/soundboard
        shell: bash
      - name: Verify executable (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: test target/${{ matrix.target }}/release/soundboard.exe
        shell: bash
      - name: Upload build artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: ${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/soundboard
            target/${{ matrix.target }}/release/soundboard.exe
  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download All Build Artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          path: downloads
      - name: Create release and upload artifacts
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: Automated build for latest
          files: |
            downloads/linux/soundboard
            downloads/windows/soundboard.exe
